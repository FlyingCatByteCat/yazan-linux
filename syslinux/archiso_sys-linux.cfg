LABEL arch
TEXT HELP
Boot the Yazan Linux install medium on BIOS.
It allows you to install Yazan Linux or perform system maintenance.
ENDTEXT
MENU LABEL Yazan Linux install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%